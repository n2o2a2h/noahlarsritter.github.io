<section id="contact">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Contact Me</h2>
        <h3 class="section-subheading text-muted" style="color: white !important;">
          I'd love to hear from you!
        </h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <form id="contactForm" novalidate>
          <div class="row">
            <div class="col-md-6">
              <div class="control-group form-group">
                <input type="text" class="form-control" name="user_name" placeholder="Your Name *" required>
              </div>
              <div class="control-group form-group">
                <input type="email" class="form-control" name="user_email" placeholder="Your Email *" required>
              </div>
              <div class="control-group form-group">
                <input type="tel" class="form-control" name="user_phone" placeholder="Your Phone *" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="control-group form-group">
                <textarea class="form-control" name="message" placeholder="Your Message *" required></textarea>
              </div>
            </div>
            <div class="clearfix"></div>
            <div class="col-lg-12 text-center">
              <div id="form-status"></div>
              <button type="submit" class="btn btn-xl">Send Message</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- EmailJS Script -->
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
  emailjs.init("4Q4qmiBqsz_gWbxUV");

  document.getElementById('contactForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const statusDiv = document.getElementById('form-status');
    statusDiv.innerHTML = 'Sending…';

    emailjs.sendForm('service_xm6mdb8', 'template_2590aqr', this)
      .then(() => {
        statusDiv.innerHTML = '<span style="color:green;">Message sent successfully!</span>';
        this.reset();
      }, (error) => {
        console.error(error);
        statusDiv.innerHTML = '<span style="color:red;">Oops… something went wrong. Please try again later.</span>';
      });
  });
</script>
