<!-- Portfolio Grid Section -->
<section id="portfolio" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Portfolio</h2>
                <h3 class="section-subheading text-muted">My Films, Photos, Art, and Stories.</h3>
            </div>
        </div>

        <div class="row">
            {% for post in site.posts %}
                <div class="col-md-4 col-sm-6 portfolio-item">
                    <a href="#portfolioModal{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
                        <div class="portfolio-hover">
                            <div class="portfolio-hover-content">
                                <i class="fa fa-plus fa-3x"></i>
                            </div>
                        </div>

                        <!-- Thumbnail with 3:2 aspect ratio -->
                        <div class="thumbnail-container">
                            <img 
                                src="img/portfolio/{{ post.thumbnail }}" 
                                class="thumbnail-img" 
                                alt="{{ post.alt }}">
                        </div>
                    </a>
                    <div class="portfolio-caption">
                        <h4>{{ post.title }}</h4>
                        <p class="text-muted">{{ post.subtitle }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Example of project/post image inside modal -->
<!-- These images are smaller, keep their natural aspect ratio, distinct from thumbnails -->
<img 
    src="img/portfolio/{{ post.project-img }}" 
    class="project-img" 
    alt="{{ post.title }}">
    

<!-- CSS -->
<style>
/* Thumbnails */
.thumbnail-container {
    width: 100%;
    aspect-ratio: 3 / 2;  /* fixed 3:2 ratio */
    overflow: hidden;
    border-radius: 6px;
}

.thumbnail-img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* fills container, crops if needed */
    display: block;
}

/* Project/Post images */
.project-img {
    max-width: 600px;    /* smaller size for modal or detail view */
    width: 100%;
    height: auto;        /* preserve original aspect ratio */
    display: block;
    margin: 0 auto;
    border-radius: 6px;
}
</style>
